[project]
name = "tiny-circuits"
version = "0.1.0"
description = "Mechanistic interpretability of GPT-2 small: reverse-engineering the induction circuit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "circuitsvis>=1.43.3",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "torch>=2.14.0",
    "transformer-lens>=3.9.0",
    "wandb>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_circuits"]
